<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الإشعارات | روستو</title>
  <link rel="icon" href="../brand/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <style>
    .notif-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .notif-badge { background: var(--red); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: .8rem; }
    .notif-item { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: background .15s; }
    .notif-item:hover { background: var(--cream); }
    .notif-item.unread { border-color: var(--red-200, #f5c6c8); background: var(--red-050, #fff5f5); }
    .notif-item h3 { margin: 0 0 6px; font-size: .95rem; }
    .notif-item p { margin: 0; color: var(--ink-500); font-size: .85rem; line-height: 1.6; }
    .notif-meta { display: flex; gap: 8px; margin-top: 8px; font-size: .75rem; color: var(--ink-400, #888); }
    .notif-cat { background: #eee; border-radius: 6px; padding: 2px 8px; }
    .pref-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .pref-row label { font-size: .9rem; }
    .pref-toggles { display: flex; gap: 14px; font-size: .8rem; }
  </style>
</head>
<body data-portal-page="notifications">
  <div id="portalHeader"></div>

  <main class="portal-main">
    <div id="portalConfig"></div>

    <section class="portal-hero">
      <h1>الإشعارات</h1>
      <p>صندوق الإشعارات وتفضيلاتك</p>
      <div class="notif-toolbar" style="margin-top:12px">
        <span class="notif-badge" id="unreadBadge">0 غير مقروء</span>
        <button id="readAllBtn" class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)">تعليم الكل مقروء</button>
        <button id="refreshBtn" class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.4)">تحديث</button>
      </div>
    </section>

    <section class="portal-card">
      <h2>صندوق الإشعارات</h2>
      <div class="notif-toolbar">
        <label><input type="checkbox" id="unreadOnly" /> غير المقروء فقط</label>
      </div>
      <div id="notifList" class="portal-empty">جاري التحميل…</div>
    </section>

    <section class="portal-card" style="margin-top:18px">
      <h2>تفضيلات الإشعارات</h2>
      <div id="prefList"></div>
      <button id="savePrefsBtn" class="btn btn-primary btn-sm" style="margin-top:12px">حفظ التفضيلات</button>
    </section>
  </main>

  <div id="portalToast" class="portal-toast"></div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/portal-layout.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
