<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حسابي | روستو</title>
  <link rel="icon" href="../brand/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/portal.css" />
</head>
<body data-portal-page="account">
  <div id="portalHeader"></div>

  <main class="portal-main">
    <div id="portalConfig"></div>

    <section class="portal-hero" id="profileHero">
      <h1>حسابي</h1>
      <p>الملف الشخصي وسجل الطلبات</p>
    </section>

    <div class="portal-grid-2">
      <section class="portal-card">
        <h2>الملف الشخصي</h2>
        <div id="profileInfo">جاري التحميل…</div>
      </section>
      <section class="portal-card">
        <h2>العضوية والنقاط</h2>
        <div id="loyaltyInfo">جاري التحميل…</div>
      </section>
    </div>

    <section class="portal-card" style="margin-top:18px">
      <h2>سياراتي</h2>
      <div id="vehiclesList"></div>
    </section>

    <section class="portal-card" style="margin-top:18px">
      <h2>سجل الطلبات</h2>
      <div id="bookingsList">جاري التحميل…</div>
    </section>
  </main>

  <div id="portalFooter"></div>
  <div id="portalToast" class="portal-toast"></div>

  <script src="js/api.js"></script>
  <script src="js/portal-layout.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
