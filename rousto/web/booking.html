<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>احجز خدمة | روستو</title>
  <link rel="icon" href="../brand/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/portal.css" />
</head>
<body data-portal-page="booking">
  <div id="portalHeader"></div>

  <main class="portal-main">
    <div id="portalConfig"></div>

    <section class="portal-hero">
      <h1>احجز خدمة صيانة</h1>
      <p>اختر الخدمة وحدّد الموعد — الأسعار بالدينار</p>
    </section>

    <div class="portal-grid-2">
      <section class="portal-card">
        <h2>الخدمة</h2>
        <div id="servicesList">جاري التحميل…</div>
      </section>

      <section class="portal-card">
        <h2>تفاصيل الحجز</h2>
        <form id="bookingForm">
          <div class="portal-field">
            <label for="vehicleSelect">السيارة</label>
            <select id="vehicleSelect"></select>
          </div>
          <div class="portal-field">
            <label for="addressSelect">العنوان</label>
            <select id="addressSelect"></select>
          </div>
          <div class="portal-field">
            <label for="paymentSelect">طريقة الدفع</label>
            <select id="paymentSelect"></select>
          </div>
          <div class="portal-field">
            <label for="scheduledAt">الموعد</label>
            <input id="scheduledAt" type="datetime-local" required />
          </div>
          <div class="portal-field">
            <label for="promoCode">كود الخصم</label>
            <input id="promoCode" type="text" value="ROUSTO" placeholder="مثال: ROUSTO" />
          </div>
          <div class="portal-field">
            <label for="notes">ملاحظات</label>
            <textarea id="notes" rows="2" placeholder="أي تفاصيل إضافية"></textarea>
          </div>

          <div id="priceSummary" class="portal-card" style="background:var(--cream);margin-bottom:14px">
            <div class="portal-summary-row"><span>الخدمة</span><span id="sumService">—</span></div>
            <div class="portal-summary-row"><span>الخصم</span><span id="sumDiscount" class="discount">—</span></div>
            <div class="portal-summary-row total"><span>الإجمالي</span><span id="sumTotal">—</span></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">تأكيد الحجز</button>
        </form>
      </section>
    </div>
  </main>

  <div id="portalFooter"></div>
  <div id="portalToast" class="portal-toast"></div>

  <script src="js/api.js"></script>
  <script src="js/portal-layout.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
