<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الدعم والأمان | روستو</title>
  <link rel="icon" href="../brand/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <style>
    .faq-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .faq-item h3 { margin: 0 0 6px; font-size: .95rem; }
    .faq-item p { margin: 0; color: var(--ink-500); font-size: .85rem; line-height: 1.6; }
    .ticket-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; cursor: pointer; }
    .ticket-card:hover { background: var(--cream); }
    .messages { max-height: 240px; overflow: auto; margin-top: 12px; }
    .msg { padding: 8px 10px; border-radius: 10px; margin-bottom: 8px; font-size: .85rem; }
    .msg.customer { background: var(--red-050); }
    .msg.admin { background: #e8f7f0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-portal-page="support">
  <div id="portalHeader"></div>

  <main class="portal-main">
    <div id="portalConfig"></div>

    <section class="portal-hero">
      <h1>الدعم والأمان</h1>
      <p>تذاكر الدعم والأسئلة الشائعة</p>
      <button id="refreshBtn" class="btn btn-ghost btn-sm" style="margin-top:12px;color:#fff;border-color:rgba(255,255,255,.4)">تحديث</button>
    </section>

    <section class="portal-card">
      <h2>الأسئلة الشائعة</h2>
      <div id="faqList"></div>
    </section>

    <section class="portal-card" style="margin-top:18px">
      <h2>فتح تذكرة جديدة</h2>
      <form id="ticketForm">
        <div class="grid-2">
          <div class="portal-field">
            <label for="category">التصنيف</label>
            <select id="category">
              <option value="booking">الحجوزات</option>
              <option value="payment">المدفوعات</option>
              <option value="account">الحساب</option>
              <option value="technical">تقني</option>
              <option value="other">أخرى</option>
            </select>
          </div>
          <div class="portal-field">
            <label for="priority">الأولوية</label>
            <select id="priority">
              <option value="normal">عادية</option>
              <option value="high">عالية</option>
              <option value="urgent">عاجلة</option>
            </select>
          </div>
        </div>
        <div class="portal-field">
          <label for="subject">الموضوع</label>
          <input id="subject" required placeholder="وصف مختصر للمشكلة" />
        </div>
        <div class="portal-field">
          <label for="message">التفاصيل</label>
          <textarea id="message" rows="3" required placeholder="اشرح المشكلة بالتفصيل"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">إرسال التذكرة</button>
      </form>
    </section>

    <section class="portal-card" style="margin-top:18px">
      <h2>تذاكري</h2>
      <div id="ticketList"></div>
      <div id="ticketDetail" style="display:none;margin-top:14px">
        <h3 id="detailSubject"></h3>
        <div id="messages" class="messages"></div>
        <form id="replyForm" style="margin-top:10px">
          <div class="portal-field">
            <textarea id="replyMessage" placeholder="أضف رداً"></textarea>
          </div>
          <button type="submit" class="btn btn-ghost btn-sm">إرسال</button>
        </form>
      </div>
    </section>

    <section class="portal-card" style="margin-top:18px">
      <h2>الأمان</h2>
      <p id="securitySummary" class="muted">—</p>
      <form id="reportForm">
        <div class="portal-field">
          <textarea id="reportDesc" placeholder="صف النشاط المشبوه"></textarea>
        </div>
        <button type="submit" class="btn btn-ghost btn-sm">إبلاغ</button>
      </form>
    </section>
  </main>

  <div id="portalFooter"></div>
  <div id="portalToast" class="portal-toast"></div>

  <script src="js/api.js"></script>
  <script src="js/portal-layout.js"></script>
  <script src="js/support.js"></script>
</body>
</html>
