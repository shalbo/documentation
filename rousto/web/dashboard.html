<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحتي | روستو</title>
  <link rel="icon" href="../brand/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/portal.css" />
</head>
<body data-portal-page="dashboard">
  <div id="portalHeader"></div>

  <main class="portal-main">
    <div id="portalConfig"></div>

    <section class="portal-hero" id="welcomeHero">
      <h1>مرحباً…</h1>
      <p>لوحة تحكم عميل روستو</p>
    </section>

    <section class="portal-grid" id="statsGrid">
      <article class="portal-card portal-stat"><b id="statServices">—</b><span>خدمات سابقة</span></article>
      <article class="portal-card portal-stat"><b id="statVehicles">—</b><span>سيارات</span></article>
      <article class="portal-card portal-stat"><b id="statPoints">—</b><span>نقطة ولاء</span></article>
    </section>

    <section class="portal-card" style="margin-top:18px" id="activeSection">
      <h2>الحجز النشط</h2>
      <div id="activeBooking" class="portal-empty">جاري التحميل…</div>
    </section>

    <section class="portal-card" style="margin-top:18px">
      <h2>إجراءات سريعة</h2>
      <div class="portal-actions">
        <a href="booking.html" class="btn btn-primary btn-sm">احجز خدمة</a>
        <a href="delivery-map.html" class="btn btn-ghost btn-sm">تتبّع التوصيل</a>
        <a href="pricing.html" class="btn btn-ghost btn-sm">الأسعار</a>
        <a href="support.html" class="btn btn-ghost btn-sm">الدعم</a>
        <a href="account.html" class="btn btn-ghost btn-sm">حسابي</a>
      </div>
    </section>
  </main>

  <div id="portalFooter"></div>
  <div id="portalToast" class="portal-toast"></div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/portal-layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
