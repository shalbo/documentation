<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>روستو — تتبّع التوصيل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/delivery-map.css" />
</head>
<body>
  <header class="delivery-header">
    <div>
      <h1>تتبّع التوصيل</h1>
      <p id="phaseLabel">جاري التحميل…</p>
    </div>
    <button id="refreshBtn" class="btn btn-secondary">تحديث</button>
  </header>

  <main class="delivery-layout">
    <section class="card">
      <div class="config-grid">
        <div>
          <label for="apiBase">عنوان API</label>
          <input id="apiBase" type="url" value="http://localhost:8000" />
        </div>
        <div>
          <label for="userId">معرّف العميل (X-User-Id)</label>
          <input id="userId" value="a0000000-0000-4000-8000-000000000001" />
        </div>
      </div>
    </section>

    <section class="card">
      <div class="booking-meta">
        <div>
          <span class="label">الحجز</span>
          <strong id="bookingRef">—</strong>
        </div>
        <div>
          <span class="label">المسافة</span>
          <strong id="distanceKm">—</strong>
        </div>
        <div>
          <span class="label">الوصول</span>
          <strong id="etaMinutes">—</strong>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-head">
          <span>تقدّم التوصيل</span>
          <strong id="progressPercent">—</strong>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <div id="mapView" class="delivery-map"></div>
    </section>

    <section class="card">
      <h2>الفني</h2>
      <div id="technicianCard" class="technician-card">—</div>
    </section>

    <section class="card">
      <h2>مراحل الخدمة</h2>
      <ul id="stepsList" class="steps-list"></ul>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/delivery-map.js"></script>
</body>
</html>
