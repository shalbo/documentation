<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تتبّع التوصيل | روستو</title>
  <link rel="icon" href="../brand/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="stylesheet" href="css/delivery-map.css" />
</head>
<body data-portal-page="tracking">
  <div id="portalHeader"></div>

  <main class="portal-main">
    <div id="portalConfig"></div>

    <section class="portal-hero">
      <h1>تتبّع التوصيل</h1>
      <p id="phaseLabel">جاري التحميل…</p>
      <button id="refreshBtn" class="btn btn-ghost btn-sm" style="margin-top:12px;color:#fff;border-color:rgba(255,255,255,.4)">تحديث</button>
    </section>

    <section class="portal-card">
      <div class="booking-meta">
        <div>
          <span class="label">الحجز</span>
          <strong id="bookingRef">—</strong>
        </div>
        <div>
          <span class="label">المسافة</span>
          <strong id="distanceKm">—</strong>
        </div>
        <div>
          <span class="label">الوصول</span>
          <strong id="etaMinutes">—</strong>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-head">
          <span>تقدّم التوصيل</span>
          <strong id="progressPercent">—</strong>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <div id="mapView" class="delivery-map"></div>
    </section>

    <section class="portal-card" style="margin-top:18px">
      <h2>الفني</h2>
      <div id="technicianCard" class="technician-card">—</div>
    </section>

    <section class="portal-card" style="margin-top:18px">
      <h2>مراحل الخدمة</h2>
      <ul id="stepsList" class="steps-list"></ul>
    </section>
  </main>

  <div id="portalFooter"></div>
  <div id="portalToast" class="portal-toast"></div>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/portal-layout.js"></script>
  <script src="js/delivery-map.js"></script>
</body>
</html>
