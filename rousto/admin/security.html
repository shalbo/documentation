<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>روستو — سجل الأمان</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>روستو — سجل الأمان</h1>
      <p>أحداث التدقيق والتنبيهات</p>
    </div>
    <div class="topbar-actions">
      <a href="support.html" class="btn btn-ghost-light">الدعم</a>
      <button id="refreshBtn" class="btn btn-secondary">تحديث</button>
    </div>
  </header>

  <main class="layout">
    <section class="card">
      <div class="config-grid">
        <div><label for="apiBase">عنوان API</label><input id="apiBase" value="http://localhost:8000" /></div>
        <div><label for="adminKey">مفتاح الإدارة</label><input id="adminKey" type="password" value="rousto_admin_dev" /></div>
      </div>
    </section>

    <section class="card">
      <h2>حالة التصلّب</h2>
      <div id="statusGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:12px"></div>
      <ul id="warningsList" style="color:#b45309;font-size:.9rem"></ul>
    </section>

    <section class="card">
      <h2>
        الأحداث
        <select id="severityFilter">
          <option value="">الكل</option>
          <option value="info">معلومات</option>
          <option value="warn">تحذير</option>
          <option value="critical">حرج</option>
        </select>
      </h2>
      <table id="eventsTable">
        <thead>
          <tr><th>النوع</th><th>الخطورة</th><th>المستخدم</th><th>IP</th><th>الوقت</th></tr>
        </thead>
        <tbody><tr><td colspan="5" class="empty">تحديث</td></tr></tbody>
      </table>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script>
    const STORAGE_KEY = "rousto_admin_config";
    const state = { apiBase: "http://localhost:8000", adminKey: "rousto_admin_dev" };
    const $ = (id) => document.getElementById(id);

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.className = "toast show";
      setTimeout(() => el.classList.remove("show"), 2400);
    }

    function renderStatus(status) {
      const items = [
        ["البيئة", status.environment],
        ["رؤوس أمنية", status.security_headers_enabled ? "✓" : "—"],
        ["Legacy headers", status.allow_legacy_headers ? "مفعّل" : "معطّل"],
        ["OpenAPI", status.disable_openapi ? "معطّل" : "مفعّل"],
        ["Rate limit إدارة", status.admin_rate_limit_per_minute + "/د"],
        ["جاهز للإنتاج", status.production_ready ? "✓" : "—"],
      ];
      $("statusGrid").innerHTML = items.map(([l, v]) =>
        `<div><b>${v}</b><div style="color:#888;font-size:.85rem">${l}</div></div>`
      ).join("");
      const warnings = status.production_warnings || [];
      $("warningsList").innerHTML = warnings.length
        ? warnings.map((w) => `<li>${w}</li>`).join("")
        : "<li style='color:#666'>لا تحذيرات إنتاج</li>";
    }

    async function refresh() {
      const apiBase = $("apiBase").value.replace(/\/$/, "");
      const adminKey = $("adminKey").value.trim();
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ apiBase, adminKey }));
      const headers = { "X-Admin-Key": adminKey };

      const statusRes = await fetch(`${apiBase}/api/v1/admin/security/status`, { headers });
      const statusBody = await statusRes.json();
      if (statusRes.ok) renderStatus(statusBody.data);

      const sev = $("severityFilter").value;
      const q = sev ? `?severity=${sev}` : "";
      const res = await fetch(`${apiBase}/api/v1/admin/security/events${q}`, { headers });
      const body = await res.json();
      if (!res.ok) throw new Error(body?.error?.message || "خطأ");
      const tbody = $("eventsTable").querySelector("tbody");
      const events = body.data || [];
      tbody.innerHTML = events.length ? events.map((e) => `
        <tr>
          <td><b>${e.event_type}</b></td>
          <td><span class="badge ${e.severity === "warn" ? "badge-warn" : e.severity === "critical" ? "badge-off" : "badge-on"}">${e.severity}</span></td>
          <td><small>${e.user_id ? e.user_id.slice(0, 8) + "…" : "—"}</small></td>
          <td>${e.ip_address || "—"}</td>
          <td><small>${new Date(e.created_at).toLocaleString("ar-SA")}</small></td>
        </tr>`).join("") : '<tr><td colspan="5" class="empty">لا توجد أحداث</td></tr>';
      toast(`تم تحميل ${events.length} حدث`);
    }

    $("refreshBtn").addEventListener("click", () => refresh().catch((e) => toast(e.message)));
    $("severityFilter").addEventListener("change", () => refresh().catch((e) => toast(e.message)));
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      if (saved.apiBase) $("apiBase").value = saved.apiBase;
      if (saved.adminKey) $("adminKey").value = saved.adminKey;
    } catch (_) {}
    refresh().catch(() => {});
  </script>
</body>
</html>
