<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>روستو — إرسال السطحات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>روستو — إرسال السطحات</h1>
      <p>خريطة الإرسال من موقع العطل إلى الورشة</p>
    </div>
    <div class="topbar-actions">
      <a href="index.html" class="btn btn-ghost-light">لوحة السوق</a>
      <a href="logistics.html" class="btn btn-ghost-light">لوجستيات</a>
      <a href="vendor-map.html" class="btn btn-ghost-light">خريطة الفنيين</a>
      <a href="drivers.html" class="btn btn-ghost-light">السائقون</a>
      <button id="refreshBtn" class="btn btn-secondary">تحديث</button>
    </div>
  </header>

  <main class="layout">
    <section class="card">
      <h2>إعدادات الاتصال</h2>
      <div class="config-grid">
        <div>
          <label for="apiBase">عنوان API</label>
          <input id="apiBase" type="url" value="http://localhost:8000" />
        </div>
        <div>
          <label for="adminKey">مفتاح الإدارة</label>
          <input id="adminKey" type="password" value="rousto_admin_dev" />
        </div>
      </div>
    </section>

    <section class="card">
      <h2>خريطة الإرسال</h2>
      <p id="mapCaption" class="map-caption">—</p>
      <div id="mapView" class="map-host map-host-wide"></div>
      <p class="map-caption">⚠️ موقع العطل · 🚛 السطحة · 🏭 الورشة</p>
    </section>

    <section class="card">
      <h2>طلبات السحب</h2>
      <table id="dispatchTable">
        <thead>
          <tr>
            <th>المرجع</th>
            <th>التقاط</th>
            <th>تسليم</th>
            <th>الحالة</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5" class="empty">اضغط تحديث</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/towing-dispatch.js"></script>
</body>
</html>
